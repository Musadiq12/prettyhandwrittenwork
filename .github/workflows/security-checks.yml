name: Code and security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'security/**']

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files --cached --others --exclude-standard | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example
          if [[ -n "$bad_files" ]]; then
            echo "::error::Tracked environment file found. Remove it from Git and rotate any real secrets."
            printf '%s\n' "$bad_files"
            exit 1
          fi

      - name: Scan current tree for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='bun.lock' --exclude='*.map' '(SUPABASE_SERVICE_ROLE_KEY|service_role|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})' .; then
            echo "::error::Possible secret pattern found. Review matches without copying values into public logs."
            exit 1
          fi

      - name: Warn about environment files in Git history
        shell: bash
        run: |
          set -euo pipefail
          historical_env_files="$(git log --all --format= --name-only -- .env '.env.*' | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' | sort -u || true)"
          if [[ -n "$historical_env_files" ]]; then
            echo "::warning::An environment file exists in Git history. Scan historical blobs and rotate any real secrets."
            printf '%s\n' "$historical_env_files"
          fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit

  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_PROJECT_ID: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
 || true)"
          if [[ -n "$bad_files" ]]; then
            echo "::error::Tracked environment file found. Remove it from Git and rotate any real secrets."
            printf '%s\n' "$bad_files"
            exit 1
          fi

      - name: Scan current tree for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='bun.lock' --exclude='*.map' '(SUPABASE_SERVICE_ROLE_KEY|service_role|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})' .; then
            echo "::error::Possible secret pattern found. Review matches without copying values into public logs."
            exit 1
          fi

      - name: Warn about environment files in Git history
        shell: bash
        run: |
          set -euo pipefail
          historical_env_files="$(git log --all --format= --name-only -- .env '.env.*' | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' | sort -u || true)"
          if [[ -n "$historical_env_files" ]]; then
            echo "::warning::An environment file exists in Git history. Scan historical blobs and rotate any real secrets."
            printf '%s\n' "$historical_env_files"
          fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit

  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_PROJECT_ID: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
