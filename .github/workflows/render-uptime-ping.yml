name: Render Uptime Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Pretty Handwritten Work on Render
        run: curl --fail --silent --show-error --location --max-time 30 https://prettyhandwrittenwork.onrender.com/ --output /dev/null
